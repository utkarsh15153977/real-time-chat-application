# ========================================
# POSTGRESQL DATABASE FOR TESTS
# ========================================
spring.datasource.url=jdbc:postgresql://localhost:5432/auth_db?options=-c%20TimeZone%3DAsia%2FKolkata
spring.datasource.username=postgres
spring.datasource.password=password
spring.datasource.driver-class-name=org.postgresql.Driver

# ========================================
# JPA CONFIGURATION
# ========================================
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ========================================
# FLYWAY
# ========================================
spring.flyway.enabled=false

# ========================================
# SQL INIT
# ========================================
spring.sql.init.enabled=false

# ========================================
# JWT
# ========================================
jwt.secret=testSecretKeyForUnitTests12345678901234567890
jwt.expiration=86400000

# ========================================
# LOGGING
# ========================================
logging.level.org.springframework=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.com.chatapp=DEBUG

# ========================================
# DISABLE EUREKA
# ========================================
eureka.client.enabled=false
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false
spring.cloud.discovery.enabled=false

# ========================================
# DISABLE REDIS REPOSITORIES
# ========================================
spring.data.redis.repositories.enabled=false

# ========================================
# ALLOW BEAN OVERRIDING
# ========================================
spring.main.allow-bean-definition-overriding=true