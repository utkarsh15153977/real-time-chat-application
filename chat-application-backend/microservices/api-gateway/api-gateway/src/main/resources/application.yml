spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        # WebSocket STOMP route (upgraded connection goes to message-service)
        - id: message-service-ws
          uri: ws://localhost:8082
          predicates:
            - Path=/ws/**

        # REST API routes
        - id: auth-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/auth/**
          filters:
            - StripPrefix=0

        - id: user-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/users/**
          filters:
            - StripPrefix=0

        - id: chat-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/chats/**
            - Path=/api/presence/**
          filters:
            - StripPrefix=0

        - id: message-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/messages/**
            - Path=/api/v1/media/**
          filters:
            - StripPrefix=0

        - id: notification-service
          uri: http://localhost:8085
          predicates:
            - Path=/api/notifications/**
          filters:
            - StripPrefix=0

        - id: group-chat
          uri: http://localhost:8086
          predicates:
            - Path=/api/groups/**
          filters:
            - StripPrefix=0

      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_UNIQUE

      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns:
              - "http://localhost:5173"
              - "http://localhost:3000"
              - "http://127.0.0.1:5173"
              - "http://127.0.0.1:3000"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
              - HEAD
              - PATCH
            allowedHeaders:
              - Authorization
              - Content-Type
              - Accept
              - Origin
              - X-Requested-With
            allowCredentials: true
            exposedHeaders:
              - Authorization
            maxAge: 3600

# JWT Configuration (must match auth-service jwt.secret)
jwt:
  secret: ${JWT_SECRET:blinkChatSuperSecretKeyForJwtTokenSigning2024MustBeLongEnough!!}

server:
  port: 8080

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
    register-with-eureka: true
    fetch-registry: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    com.chatApplication.api_gateway: DEBUG
