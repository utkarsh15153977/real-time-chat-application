spring.application.name=message-service

server.port=8082

spring.datasource.url=jdbc:postgresql://localhost:5432/chat_application
spring.datasource.username=postgres
spring.datasource.password=postgres

# Hibernate auto-DDL (update mode for dev; Flyway migration V2 provides the canonical schema)
spring.jpa.hibernate.ddl-auto=update

eureka.client.service-url.defaultZone=http://localhost:8761/eureka

eureka.instance.prefer-ip-address=true
logging.level.org.springframework.security=DEBUG
spring.data.redis.host=localhost
spring.data.redis.port=6379

spring.kafka.bootstrap-servers=localhost:9092

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

spring.kafka.consumer.properties.spring.json.trusted.packages=*

spring.flyway.baseline-on-migrate=true
spring.cloud.compatibility-verifier.enabled=false

# JWT Configuration (must match auth-service jwt.secret)
jwt.secret=${JWT_SECRET:blinkChatSuperSecretKeyForJwtTokenSigning2024MustBeLongEnough!!}

# Internal service-to-service authentication (must match api-gateway)
security.internal-secret=${INTERNAL_SERVICE_SECRET:blinkInternalSecret2024}

# WebSocket session expiration check interval (milliseconds)
security.websocket.expiry-check-interval=30000

# AWS S3 Configuration (Presigned URL Media Upload)
aws.s3.bucket-name=${AWS_S3_BUCKET_NAME:blink-chat-media}
aws.s3.region=${AWS_S3_REGION:ap-south-1}
aws.s3.access-key=${AWS_ACCESS_KEY:}
aws.s3.secret-key=${AWS_SECRET_KEY:}
# Optional: override endpoint for local MinIO testing (leave empty for real AWS)
aws.s3.endpoint=${AWS_S3_ENDPOINT:}
# Presigned URL validity in minutes
aws.s3.presign-expiry-minutes=15
# Max upload size in bytes (50MB)
aws.s3.max-file-size-bytes=52428800

# Firebase Cloud Messaging (FCM) Configuration
# Option 1: Path to service account JSON file
gcp.firebase.credentials-path=${FIREBASE_CREDENTIALS_PATH:}
# Option 2: Base64-encoded service account JSON (for containerized deployments)
gcp.firebase.credentials-base64=${FIREBASE_CREDENTIALS_BASE64:}

# Kafka Topics
app.kafka.topics.message-created=chat.message-created
